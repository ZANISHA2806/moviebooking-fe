<div class="login-container">
  <h2>Login</h2>
  
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="form-control"
        placeholder="your@email.com"
        [disabled]="isLoading"
      />
      <div *ngIf="loginForm.get('email')?.hasError('required')" class="error-text">
        Email is required
      </div>
      <div *ngIf="loginForm.get('email')?.hasError('email')" class="error-text">
        Please enter a valid email
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        class="form-control"
        placeholder="••••••••"
        [disabled]="isLoading"
      />
      <div *ngIf="loginForm.get('password')?.hasError('required')" class="error-text">
        Password is required
      </div>
      <div *ngIf="loginForm.get('password')?.hasError('minlength')" class="error-text">
        Password must be at least 6 characters
      </div>
    </div>

    <button type="submit" class="btn-primary" [disabled]="isLoading || loginForm.invalid">
      {{ isLoading ? 'Logging in...' : 'Login' }}
    </button>
  </form>

  <div class="form-links">
    <a routerLink="/forgot-password">Forgot Password?</a>
    <p>Don't have an account? <a routerLink="/register">Register here</a></p>
  </div>
</div>
