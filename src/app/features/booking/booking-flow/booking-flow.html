<div class="booking-flow-container">
  <h2>Book Your Tickets</h2>
  <p>Follow the steps below to complete your booking</p>
  
  <div class="steps">
    <div class="step" [class.active]="currentStep >= 1">
      <div class="step-number">1</div>
      <div class="step-label">Select Movie</div>
    </div>
    <div class="step-connector" [class.active]="currentStep >= 2"></div>
    <div class="step" [class.active]="currentStep >= 2">
      <div class="step-number">2</div>
      <div class="step-label">Select Show</div>
    </div>
    <div class="step-connector" [class.active]="currentStep >= 3"></div>
    <div class="step" [class.active]="currentStep >= 3">
      <div class="step-number">3</div>
      <div class="step-label">Select Seats</div>
    </div>
    <div class="step-connector" [class.active]="currentStep >= 4"></div>
    <div class="step" [class.active]="currentStep >= 4">
      <div class="step-number">4</div>
      <div class="step-label">Confirm</div>
    </div>
  </div>

  <div class="step-content">
    <p>Booking flow coming soon...</p>
  </div>
</div>
