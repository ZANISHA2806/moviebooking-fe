<div class="movie-list-container">
  <h2>Movies</h2>

  <div class="search-filter-section">
    <div class="search-box">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="Search movies..."
        class="search-input"
      />
      <button (click)="searchMovies()" class="btn-search">Search</button>
    </div>

    <div class="filter-buttons">
      <button
        *ngFor="let status of ['ALL', 'UPCOMING', 'NOW_SHOWING', 'COMPLETED']"
        [class.active]="selectedStatus === status"
        (click)="onStatusChange(status as any)"
        class="filter-btn"
      >
        {{ status }}
      </button>
    </div>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div *ngIf="isLoading" class="loading">
    <p>Loading movies...</p>
  </div>

  <div *ngIf="!isLoading && movies.length > 0" class="movies-grid">
    <div *ngFor="let movie of movies" class="movie-card" [routerLink]="['/movie', movie.id]">
      <div class="movie-poster" *ngIf="movie.posterUrl">
        <img [src]="movie.posterUrl" [alt]="movie.title" />
      </div>
      <div class="movie-info">
        <h3>{{ movie.title }}</h3>
        <p class="synopsis">{{ movie.synopsis }}</p>
        <div class="movie-meta">
          <span class="rating">{{ movie.rating }} ⭐</span>
          <span class="duration">{{ movie.duration }} min</span>
        </div>
        <span class="status" [ngClass]="movie.status.toLowerCase()">{{ movie.status }}</span>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && movies.length === 0" class="no-movies">
    <p>No movies found</p>
  </div>
</div>
